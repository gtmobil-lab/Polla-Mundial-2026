name: Sync Match Results

on:
  workflow_dispatch:          # disparo manual desde GitHub Actions
  # cron nativo eliminado al terminar el Mundial (2026-07-20) — ver cron_sync_pollas.sql

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download script
        run: |
          curl -sSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/sync_results.py" \
            -o sync_results.py

      - name: Install dependencies
        run: pip3 install --quiet requests supabase pywebpush

      - name: Sync results
        run: python3 sync_results.py
        env:
          FOOTBALL_API_TOKEN:   ${{ secrets.FOOTBALL_API_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY:    ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:        ${{ secrets.VAPID_SUBJECT }}
