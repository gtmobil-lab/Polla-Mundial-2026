name: Sync Match Results

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:          # disparo manual desde GitHub Actions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests supabase pywebpush

      - name: Sync results
        run: python scripts/sync_results.py
        env:
          FOOTBALL_API_TOKEN:   ${{ secrets.FOOTBALL_API_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY:    ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:        ${{ secrets.VAPID_SUBJECT }}
